name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MeirKidsTV-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MeirKidsTV-${{ github.run_number }}
          path: out/*.apk

      # A release gives one simple link to download the APK straight to the phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "גרסה ${{ github.run_number }}"
          body: "קובץ ההתקנה לטלוויזיה: MeirKidsTV-${{ github.run_number }}.apk"
          files: out/*.apk
          make_latest: true

  tv-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: MeirKidsTV-${{ github.run_number }}
          path: apk

      - name: Run on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/tv-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-test-${{ github.run_number }}
          path: shots/

      # Also keep the screenshots on a side branch, easy to look at from anywhere.
      - name: Publish screenshots to the test-results branch
        if: always()
        run: |
          rm -f shots/logcat-full.txt.gz
          gzip -k shots/logcat-full.txt || true
          rm -f shots/logcat-full.txt
          mkdir -p /tmp/results && cp -r shots/. /tmp/results/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin test-results:test-results 2>/dev/null || true
          if git show-ref --quiet refs/heads/test-results; then git checkout test-results; else git checkout --orphan test-results; git rm -rf . >/dev/null; fi
          rm -rf latest && mkdir -p latest && cp -r /tmp/results/. latest/
          git add latest
          git commit -m "TV test results, build ${{ github.run_number }}" || true
          git push origin test-results
