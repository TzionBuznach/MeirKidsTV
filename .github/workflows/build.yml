name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MeirKidsTV-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MeirKidsTV-${{ github.run_number }}
          path: out/*.apk

      # A release gives one simple link to download the APK straight to the phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "גרסה ${{ github.run_number }}"
          body: "קובץ ההתקנה לטלוויזיה: MeirKidsTV-${{ github.run_number }}.apk"
          files: out/*.apk
          make_latest: true
